name: Generate Minecraft Sources

on:
  workflow_dispatch:

jobs:
  gensources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate sources
        run: ./gradlew genSources --stacktrace

      - name: List all jars in gradle caches for debugging
        run: |
          echo "=== Toàn bộ jar trong ~/.gradle chứa từ 'minecraft' hoặc 'loom' ==="
          find ~/.gradle -iname "*.jar" 2>/dev/null | grep -iE "minecraft|loom" || echo "Không tìm thấy"
          echo "=== Toàn bộ thư mục loom-cache nếu có ==="
          find ~/.gradle -type d -iname "*loom*" 2>/dev/null || echo "Không có thư mục loom"
          echo "=== Toàn bộ file .java lẻ (nếu Loom giải nén thẳng ra thư mục thay vì đóng jar) ==="
          find ~/.gradle -iname "Button.java" 2>/dev/null || echo "Không tìm thấy Button.java"
          find / -iname "Button.java" 2>/dev/null | grep -v "/proc/" | head -5 || echo "Không tìm thấy ở đâu cả"

      - name: Copy any candidate jar or java files
        run: |
          mkdir -p /tmp/mcsrc-output
          find ~/.gradle -iname "*.jar" 2>/dev/null | grep -iE "minecraft.*(sources|mapped)|mapped.*minecraft" | while read f; do
            cp "$f" /tmp/mcsrc-output/ 2>/dev/null || true
          done
          find / -iname "Button.java" 2>/dev/null | grep -v "/proc/" | while read f; do
            mkdir -p /tmp/mcsrc-output/loose-java
            cp "$f" /tmp/mcsrc-output/loose-java/ 2>/dev/null || true
          done
          ls -la /tmp/mcsrc-output/ || echo "Thư mục output trống"

      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-sources
          path: /tmp/mcsrc-output/**
          if-no-files-found: warn
