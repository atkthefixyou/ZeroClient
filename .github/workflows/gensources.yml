name: Generate Minecraft Sources

on:
  workflow_dispatch:

jobs:
  gensources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate sources
        run: ./gradlew genSources --stacktrace

      - name: Locate sources jar
        run: |
          find ~/.gradle -iname "*sources*.jar" -exec cp {} ./ \; || true
          ls -la *.jar || echo "Không tìm thấy jar nào ở thư mục gốc, kiểm tra bên trong .gradle"
          find ~/.gradle -iname "*.jar" | grep -i minecraft || true

      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-sources
          path: |
            *.jar
          if-no-files-found: warn
