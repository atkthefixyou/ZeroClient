name: Generate Minecraft Sources

on:
  workflow_dispatch:

jobs:
  gensources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prime Loom cache via build
        run: ./gradlew compileClientJava --stacktrace || true

      - name: Download CFR decompiler
        run: |
          curl -L -o cfr.jar https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar

      - name: Decompile target classes
        run: |
          mkdir -p /tmp/decompiled
          MAPPED_JAR=$(find ~/.gradle/caches/fabric-loom/minecraftMaven -iname "minecraft-common-*.jar" 2>/dev/null | grep -v intermediary | head -1)
          echo "Dùng jar: $MAPPED_JAR"
          if [ -z "$MAPPED_JAR" ]; then
            echo "LỖI: không tìm thấy jar mapped"
            exit 1
          fi
          java -jar cfr.jar "$MAPPED_JAR" \
            --outputdir /tmp/decompiled \
            2>&1 | tail -30

      - name: Find NBT source after decompile
        run: |
          find /tmp/decompiled -iname "CompoundTag.java" -o -iname "ListTag.java" -o -iname "NbtIo.java" -o -iname "Tag.java" 2>/dev/null

      - name: Package relevant files only
        run: |
          mkdir -p /tmp/output
          find /tmp/decompiled -iname "CompoundTag.java" -exec cp {} /tmp/output/ \; 2>/dev/null || true
          find /tmp/decompiled -iname "ListTag.java" -exec cp {} /tmp/output/ \; 2>/dev/null || true
          find /tmp/decompiled -iname "NbtIo.java" -exec cp {} /tmp/output/ \; 2>/dev/null || true
          ls -la /tmp/output/

      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-sources
          path: /tmp/output/*
          if-no-files-found: warn
