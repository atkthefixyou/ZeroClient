name: Generate Minecraft Sources

on:
  workflow_dispatch:

jobs:
  gensources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prime Loom cache via build
        run: ./gradlew compileClientJava --stacktrace || true

      - name: Locate the mapped (named) minecraft jar
        run: |
          echo "=== Toàn bộ jar trong fabric-loom cache ==="
          find ~/.gradle/caches/fabric-loom -iname "*.jar" 2>/dev/null

      - name: Download CFR decompiler
        run: |
          curl -L -o cfr.jar https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar

      - name: Decompile target classes
        run: |
          mkdir -p /tmp/decompiled
          NAMED_JAR=$(find ~/.gradle/caches/fabric-loom -iname "*named*.jar" 2>/dev/null | grep -v sources | head -1)
          if [ -z "$NAMED_JAR" ]; then
            echo "Không tìm thấy jar named, thử minecraft-client-only.jar thay thế"
            NAMED_JAR=~/.gradle/caches/fabric-loom/1.21.11/minecraft-client-only.jar
          fi
          echo "Dùng jar: $NAMED_JAR"
          java -jar cfr.jar "$NAMED_JAR" \
            --outputdir /tmp/decompiled \
            2>&1 | tail -50

      - name: Find Button and Screen source after decompile
        run: |
          find /tmp/decompiled -iname "Button.java" -o -iname "AbstractWidget.java" -o -iname "Screen.java" 2>/dev/null

      - name: Package relevant files only
        run: |
          mkdir -p /tmp/output
          find /tmp/decompiled -iname "Button.java" -exec cp {} /tmp/output/ \; 2>/dev/null || true
          find /tmp/decompiled -iname "AbstractWidget.java" -exec cp {} /tmp/output/ \; 2>/dev/null || true
          find /tmp/decompiled -iname "Screen.java" -exec cp {} /tmp/output/ \; 2>/dev/null || true
          ls -la /tmp/output/

      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-sources
          path: /tmp/output/*
          if-no-files-found: warn
