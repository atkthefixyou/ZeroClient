name: Generate Minecraft Sources

on:
  workflow_dispatch:

jobs:
  gensources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate sources
        run: ./gradlew genSources --stacktrace

      - name: Inspect jar contents
        run: |
          JAR=~/.gradle/caches/fabric-loom/1.21.11/minecraft-client-only.jar
          echo "=== Vài dòng đầu danh sách file trong jar ==="
          unzip -l "$JAR" | head -30
          echo "=== Đếm số file .java trong jar ==="
          unzip -l "$JAR" | grep -c "\.java$" || echo "0 file .java"
          echo "=== Đếm số file .class trong jar ==="
          unzip -l "$JAR" | grep -c "\.class$" || echo "0 file .class"
          echo "=== Tìm cụ thể Button trong jar ==="
          unzip -l "$JAR" | grep -i "button" || echo "Không thấy Button"

      - name: Copy jars for download
        run: |
          mkdir -p /tmp/mcsrc-output
          cp ~/.gradle/caches/fabric-loom/1.21.11/minecraft-client-only.jar /tmp/mcsrc-output/ 2>/dev/null || true
          cp ~/.gradle/caches/fabric-loom/1.21.11/minecraft-common.jar /tmp/mcsrc-output/ 2>/dev/null || true
          ls -la /tmp/mcsrc-output/

      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-sources
          path: /tmp/mcsrc-output/*.jar
          if-no-files-found: warn
